<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>MoonForge RE Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #11161d;
    --panel2: #151b23;
    --line: #242c36;
    --text: #d7dee7;
    --muted: #8290a3;
    --blue: #6ea8fe;
    --green: #56d364;
    --red: #ff7b72;
    --amber: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 80% -10%, #16243a 0, var(--bg) 55%); color: var(--text);
         font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 22px 28px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .4px; }
  h1 span { color: var(--blue); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .badge { border: 1px solid #2b4a7a; background: #16243a; color: #9cc4ff; padding: 4px 9px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
  main { padding: 22px 28px 70px; max-width: 1480px; margin: 0 auto; }
  #drop { border: 1px dashed #344054; border-radius: 12px; padding: 30px; text-align: center; color: var(--muted);
          cursor: pointer; background: #0e141bcc; transition: .15s; }
  #drop.over { border-color: var(--blue); color: var(--blue); background: #101b2b; }
  #drop strong { color: var(--text); font-weight: 600; }
  .toolbar { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; align-items: center; }
  input[type=text], textarea { background: var(--panel); border: 1px solid var(--line); color: var(--text);
          border-radius: 7px; padding: 9px 11px; font: inherit; }
  textarea { width: 100%; resize: vertical; }
  button { background: #1b2330; border: 1px solid #303b4a; color: var(--text); border-radius: 7px;
          padding: 9px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--blue); }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: white; }
  #files { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
  .filechip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 9px; color: var(--muted); font-size: 12px; }
  .filechip b { color: var(--text); font-weight: 500; }
  #msg { min-height: 20px; color: var(--muted); font-size: 12px; margin: 8px 0 14px; }
  #msg.ok { color: var(--green); } #msg.bad { color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 11px; padding: 15px 16px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: #aeb9c8; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1c232c; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; background: #1f6feb22; border: 1px solid #1f6feb55; font-size: 11px; color: #9cc4ff; }
  pre { background: #0c1117; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; max-height: 420px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  .empty { color: var(--muted); padding: 10px 0; }
</style>

<header>
  <div>
    <h1>MoonForge <span>RE Workbench</span></h1>
    <div class="sub">跨格式证据 · 发布差分 · CI 门禁。纯 MoonBit / WASM，零后端，离线运行。</div>
  </div>
  <div class="badge">moonforge-v2 · evidence / diff / gate</div>
</header>

<main>
  <div id="drop">
    <strong>拖入一个或多个文件</strong><br />
    PE / ELF / Mach-O / Info.plist / WASM · 两个文件自动生成 diff
  </div>
  <input id="file" type="file" multiple hidden />
  <div id="files"></div>

  <div class="toolbar">
    <input id="q" type="text" placeholder="跨文件搜索字符串，例如 HeapAlloc / CFBundleIdentifier" />
    <button id="go" class="primary">分析</button>
    <button id="export">导出 JSON</button>
    <button id="demo">加载 Demo</button>
  </div>
  <div class="toolbar">
    <textarea id="policy" rows="3" placeholder="可选：粘贴 policy JSON（需两个 artifact 才会执行 gate），例如 {&quot;rules&quot;:[{&quot;id&quot;:&quot;no-new-import&quot;,&quot;kind&quot;:&quot;import&quot;,&quot;change&quot;:&quot;added&quot;,&quot;key_prefix&quot;:&quot;kernel32!&quot;}]}"></textarea>
  </div>
  <div id="msg"></div>

  <div id="out"></div>
</main>

<script type="module">
import { createRuntime } from "./runtime.mjs";

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const q = document.getElementById("q");
const policyInput = document.getElementById("policy");
const go = document.getElementById("go");
const exportBtn = document.getElementById("export");
const demoBtn = document.getElementById("demo");
const msg = document.getElementById("msg");
const out = document.getElementById("out");
const filesEl = document.getElementById("files");

let modulePromise = null;
let runtime = null;
let current = [];
let lastResult = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (s, n = 16) => s && s.length > n ? s.slice(0, n) + "…" : s;
const hex = (n) => "0x" + Number(n ?? 0).toString(16);

async function loadRuntime() {
  if (!modulePromise) {
    msg.textContent = "loading wasm…";
    modulePromise = fetch("./main.wasm")
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
      .then((buf) => new WebAssembly.Module(buf))
      .then((m) => {
        runtime = createRuntime(m);
        msg.textContent = "wasm ready";
        msg.className = "ok";
        return runtime;
      });
  }
  return modulePromise;
}

function renderFiles() {
  filesEl.innerHTML = current.map((f, i) => `<span class="filechip"><b>${esc(f.name)}</b> · ${f.bytes.length} B</span>`).join("");
  drop.innerHTML = current.length
    ? `<strong>${current.length} 个 artifact 已就绪</strong><br />继续拖入文件，或点击重新选择`
    : `<strong>拖入一个或多个文件</strong><br />PE / ELF / Mach-O / Info.plist / WASM · 两个文件自动生成 diff`;
}

function renderArtifact(a) {
  const x = a.xref_v2;
  const ledger = x?.ledger || {};
  const readClass = a.read_status === "ok" ? "ok" : "bad";
  const parseClass = a.parse_status === "parsed" ? "ok" : a.parse_status === "missing" ? "bad" : "warn";
  let html = `<section class="card">
    <h2>${esc(a.name)} <span class="pill">${esc(a.format)}</span></h2>
    <table><tbody>
      <tr><th>read</th><td class="${readClass}">${esc(a.read_status)}</td></tr>
      <tr><th>parse</th><td class="${parseClass}">${esc(a.parse_status)}</td></tr>
      <tr><th>size</th><td class="num">${a.size} B</td></tr>
      <tr><th>sha256</th><td title="${esc(a.sha256)}">${esc(short(a.sha256, 20))}</td></tr>
      <tr><th>sections</th><td class="num">${a.summary.sections}</td></tr>
      <tr><th>symbols</th><td class="num">${a.summary.symbols}</td></tr>
      <tr><th>imports</th><td class="num">${a.summary.imports}</td></tr>
      <tr><th>exports</th><td class="num">${a.summary.exports}</td></tr>
    </tbody></table>`;
  if (x) {
    html += `<h2>IAT → 调用点证据</h2>
      <table><tbody>
        <tr><th>decoded calls</th><td class="num">${ledger.decoded_calls ?? 0}</td></tr>
        <tr><th>attributed</th><td class="num">${x.sites?.length ?? 0}</td></tr>
        <tr><th>unresolved direct</th><td class="num">${ledger.unresolved_direct ?? 0}</td></tr>
        <tr><th>indirect</th><td class="num">${ledger.indirect_calls ?? 0}</td></tr>
        <tr><th>refused bytes</th><td class="num">${ledger.refused_bytes ?? 0}</td></tr>
        <tr><th>sections scanned</th><td class="num">${ledger.sections_scanned ?? 0}</td></tr>
      </tbody></table>`;
    if (x.by_api?.length) {
      html += `<table><thead><tr><th>API</th><th class="num">sites</th></tr></thead><tbody>`;
      for (const item of x.by_api.slice(0, 15)) html += `<tr><td>${esc(item.api)}</td><td class="num">${item.count}</td></tr>`;
      html += `</tbody></table>`;
    }
    if (x.sites?.length) {
      const shown = x.sites.slice(0, 200);
      html += `<details><summary>调用点明细 · 显示 ${shown.length} / ${x.sites.length}</summary>
        <table><thead><tr><th>API</th><th>call</th><th>target</th><th>section</th><th>RVA</th><th>bytes</th><th>rule</th></tr></thead><tbody>`;
      for (const s of shown) {
        html += `<tr><td>${esc(s.api)}</td><td>${hex(s.call)}</td><td>${hex(s.target)}</td><td>${esc(s.section)}</td><td>${hex(s.rva)}</td><td>${esc((s.bytes || []).join(" "))}</td><td>${esc(s.rule)}</td></tr>`;
      }
      html += `</tbody></table></details>`;
    }
  } else if (a.read_status === "ok" && a.parse_status === "parsed") {
    html += `<div class="empty">非 PE：未伪造 xref 空表。</div>`;
  } else {
    html += `<div class="empty">输入不可用或未解析：未生成 xref 证据。</div>`;
  }
  if (Array.isArray(a.wasm)) {
    html += `<h2>WASM sections</h2><table><thead><tr><th>name</th><th class="num">offset</th><th class="num">size</th></tr></thead><tbody>`;
    for (const s of a.wasm) html += `<tr><td>${esc(s.name)}</td><td class="num">${s.offset}</td><td class="num">${s.size}</td></tr>`;
    html += `</tbody></table>`;
  }
  html += `</section>`;
  return html;
}

function diffRows(items) {
  if (!items?.length) return "";
  return `<table><thead><tr><th>change</th><th>kind</th><th>key</th><th>old</th><th>new</th></tr></thead><tbody>` +
    items.map((d) => `<tr><td class="${d.change === "added" ? "ok" : d.change === "removed" ? "bad" : "warn"}">${esc(d.change)}</td><td>${esc(d.kind)}</td><td>${esc(d.key)}</td><td>${esc(d.old_value)}</td><td>${esc(d.new_value)}</td></tr>`).join("") +
    `</tbody></table>`;
}

function render(j) {
  let html = `<div class="grid">${(j.artifacts || []).map(renderArtifact).join("")}</div>`;
  if (j.diff) {
    html += `<section class="card" style="margin-top:14px"><h2>Old / New 发布差分</h2>
      ${diffRows(j.diff.added)}${diffRows(j.diff.removed)}${diffRows(j.diff.changed)}
      ${!j.diff.added?.length && !j.diff.removed?.length && !j.diff.changed?.length ? `<div class="empty">两个 artifact 的归一化事实一致。</div>` : ""}
    </section>`;
  }
  if (j.gate) {
    const gateClass = j.gate.passed ? "ok" : "bad";
    html += `<section class="card" style="margin-top:14px"><h2>Policy gate · <span class="${gateClass}">${j.gate.passed ? "PASS" : "BLOCK"}</span></h2>`;
    if (j.gate.error) {
      html += `<div class="bad">${esc(j.gate.error)}</div>`;
    } else if (j.gate.violations?.length) {
      html += `<table><thead><tr><th>rule</th><th>severity</th><th>change</th><th>kind</th><th>key</th><th>message</th></tr></thead><tbody>`;
      for (const v of j.gate.violations) {
        html += `<tr><td>${esc(v.rule_id)}</td><td>${esc(v.severity)}</td><td>${esc(v.change)}</td><td>${esc(v.kind)}</td><td>${esc(v.key)}</td><td>${esc(v.message)}</td></tr>`;
      }
      html += `</tbody></table>`;
    } else {
      html += `<div class="empty">${j.gate.passed ? "没有匹配的违规项。" : "Gate 未通过，但没有返回违规明细。"}</div>`;
    }
    html += `</section>`;
  }
  if (j.bundle) {
    html += `<section class="card" style="margin-top:14px"><h2>Bundle profile</h2>
      <table><tbody><tr><th>macho</th><td>${esc(j.bundle.macho_format)}</td></tr>
      <tr><th>bundle id</th><td>${esc(j.bundle.plist?.bundle_id ?? "—")}</td></tr>
      <tr><th>version</th><td>${esc(j.bundle.plist?.version ?? "—")}</td></tr>
      <tr><th>note</th><td>${esc(j.bundle.note)}</td></tr></tbody></table></section>`;
  }
  if (j.matches?.length) {
    html += `<section class="card" style="margin-top:14px"><h2>跨文件检索命中</h2><table><tbody>`;
    for (const m of j.matches) html += `<tr><td><span class="pill">${Number(m.score).toFixed(3)}</span></td><td>${esc(m.path)}</td><td>${esc(m.snippet)}</td></tr>`;
    html += `</tbody></table></section>`;
  }
  html += `<details style="margin-top:14px"><summary>Raw canonical JSON</summary><pre>${esc(JSON.stringify(j, null, 2))}</pre></details>`;
  out.innerHTML = html;
}

async function analyze() {
  if (!current.length) { msg.textContent = "先拖入至少一个文件"; msg.className = "bad"; return; }
  await loadRuntime();
  const files = Object.fromEntries(current.map((f) => [f.name, f.bytes]));
  const argv = ["moonforge-web-v2", ...current.map((f) => f.name)];
  if (q.value.trim()) argv.push("--query", q.value.trim());
  if (policyInput.value.trim()) argv.push("--policy", policyInput.value.trim());
  let r;
  try {
    r = runtime.run(files, argv);
  } catch (e) {
    msg.textContent = "wasm 执行失败：" + (e?.message || String(e));
    msg.className = "bad";
    return;
  }
  try {
    lastResult = JSON.parse(r.stdout);
    render(lastResult);
    msg.textContent = `ok · ${current.length} artifact(s) · ${r.stdout.length} JSON bytes${r.stderr ? ` · stderr: ${r.stderr.slice(0, 120)}` : ""}`;
    msg.className = "ok";
  } catch (e) {
    msg.textContent = "wasm 输出无法解析：" + (r.stdout || r.stderr || "").slice(0, 200);
    msg.className = "bad";
  }
}

async function accept(fileList) {
  const incoming = [...fileList];
  for (const file of incoming) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    current = current.filter((f) => f.name !== file.name);
    current.push({ name: file.name, bytes });
  }
  renderFiles();
  await analyze();
}

async function loadDemo() {
  const defs = [
    ["demo/dbg.exe", "dbg.exe"],
    ["demo/Info.plist", "Info.plist"],
    ["demo/minimal.wasm", "minimal.wasm"],
  ];
  const loaded = await Promise.all(defs.map(async ([url, name]) => {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + " HTTP " + r.status);
    return { name, bytes: new Uint8Array(await r.arrayBuffer()) };
  }));
  current = loaded;
  renderFiles();
  await analyze();
}

drop.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => fileInput.files.length && accept(fileInput.files));
for (const t of ["dragenter", "dragover"]) drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const t of ["dragleave", "drop"]) drop.addEventListener(t, () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files.length) accept(e.dataTransfer.files); });
go.addEventListener("click", analyze);
q.addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
demoBtn.addEventListener("click", () => loadDemo().catch((e) => { msg.textContent = "demo 加载失败：" + e.message; msg.className = "bad"; }));
exportBtn.addEventListener("click", () => {
  if (!lastResult) { msg.textContent = "还没有可导出的结果"; msg.className = "bad"; return; }
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "moonforge-report.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
loadRuntime().catch(() => { msg.textContent = "wasm 加载失败：请用 http:// 打开本页"; msg.className = "bad"; });
</script>
</html>
